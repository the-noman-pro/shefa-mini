name: Rollback staging

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA from develop whose images to put back on staging
        required: true

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    runs-on: [self-hosted, staging]
    environment:
      name: staging
      url: http://localhost:8081
    env:
      IMAGE_TAG: ${{ inputs.sha }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      COMPOSE_FILE: compose.staging.yaml
    steps:
      - name: Check the input is a full commit SHA
        run: echo "$IMAGE_TAG" | grep -Eqx '[0-9a-f]{40}'
      - uses: actions/checkout@v7
      - run: docker compose pull
      - run: docker compose up -d --wait --remove-orphans
      - run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8081/api/health/
      - name: Notify Slack
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULT: ${{ job.status }}
        run: |
          bash .github/notify-slack.sh "$RESULT" "Staging rollback to ${IMAGE_TAG:0:7}: $RESULT, by $GITHUB_ACTOR"
