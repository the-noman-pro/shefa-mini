name: Rollback staging

on:
  workflow_dispatch:
    inputs:
      service:
        description: Which part to roll back
        type: choice
        options: [backend, frontend]
        required: true
      sha:
        description: Full develop commit SHA that built an image of this service
        required: true

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    runs-on: [self-hosted, staging]
    environment:
      name: staging
      url: http://localhost:8081
    env:
      SERVICE: ${{ inputs.service }}
      BACKEND_TAG: ${{ inputs.service == 'backend' && inputs.sha || 'develop' }}
      FRONTEND_TAG: ${{ inputs.service == 'frontend' && inputs.sha || 'develop' }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      COMPOSE_FILE: compose.staging.yaml
    steps:
      - name: Check the input is a full commit SHA
        env:
          SHA: ${{ inputs.sha }}
        run: echo "$SHA" | grep -Eqx '[0-9a-f]{40}'
      - uses: actions/checkout@v7
      - run: docker compose pull "$SERVICE"
      - run: docker compose up -d --wait --no-deps "$SERVICE"
      - run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8081/api/health/
      - name: Notify Slack
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULT: ${{ job.status }}
          SHA: ${{ inputs.sha }}
        run: |
          bash .github/notify-slack.sh "$RESULT" "Staging rollback of $SERVICE to ${SHA:0:7}: $RESULT, by $GITHUB_ACTOR"
