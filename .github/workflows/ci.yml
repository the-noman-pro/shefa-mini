name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shefa
          POSTGRES_USER: shefa
          POSTGRES_PASSWORD: shefa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shefa -d shefa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://shefa:shefa@localhost:5432/shefa
      SECRET_KEY: ci-only-not-secret
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate
      - run: pytest

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  images:
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/the-noman-pro/shefa-mini-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/the-noman-pro/shefa-mini-${{ matrix.service }}:develop
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [images]
    runs-on: [self-hosted, staging]
    environment:
      name: staging
      url: http://localhost:8081
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ github.sha }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      COMPOSE_FILE: compose.staging.yaml
    steps:
      - uses: actions/checkout@v7
      - run: docker compose pull
      - run: docker compose up -d --wait db
      - run: docker compose run --rm backend python manage.py migrate --noinput
      - run: docker compose up -d --wait --remove-orphans
      - run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8081/api/health/
