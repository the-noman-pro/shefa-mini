name: shefa-mini

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shefa
      POSTGRES_USER: shefa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shefa -d shefa"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: shefa-backend
    environment:
      SECRET_KEY: ${SECRET_KEY:?set it in .env}
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://shefa:${POSTGRES_PASSWORD}@db:5432/shefa
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: shefa-frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: